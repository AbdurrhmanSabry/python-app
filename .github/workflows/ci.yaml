name: ci

on:
  push:
    paths:
      - 'src/**'
    branches:
      - main

jobs:
  docker:
    runs-on:
      - self-hosted
      # - kubernetes
      # - kaniko

    steps:
      -
       uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - 
        name: Get the last 7 characters of the git commit SHA
        run: |
          github_sha_hash=${{ github.sha }}
          github_sha_short="${github_sha_hash:0:7}"
          echo "COMMIT_SHORT_SHA=$github_sha_short" >> $GITHUB_ENV

      - 
        name: Confirm git commit SHA output
        run: echo ${{ env.COMMIT_SHORT_SHA }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:${{ env.COMMIT_SHORT_SHA }}