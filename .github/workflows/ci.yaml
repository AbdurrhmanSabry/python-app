name: ci

on:
  push:
    paths:
      - 'src/**'
    branches:
      - main

jobs:
  docker:
    runs-on:
      - self-hosted
      # - kubernetes
      # - kaniko

    steps:
      -
       uses: actions/checkout@v4
      # -
      #   name: Login to Docker Hub
      #   uses: docker/login-action@v4
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      # -
      #   name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v4
      - 
        name: Get the last 7 characters of the git commit SHA
        run: |
          github_sha_hash=${{ github.sha }}
          github_sha_short="${github_sha_hash:0:7}"
          echo "COMMIT_SHORT_SHA=$github_sha_short" >> $GITHUB_ENV

      - 
        name: Confirm git commit SHA output
        run: echo ${{ env.COMMIT_SHORT_SHA }}
      # -
      #   name: Build and push
      #   uses: docker/build-push-action@v7
      #   with:
      #     push: true
      #     tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:${{ env.COMMIT_SHORT_SHA }}

      - 
        name: Configure Docker auth
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          mkdir -p $DOCKER_CONFIG

          cat > $DOCKER_CONFIG/config.json <<EOF
          {
            "auths": {
              "https://index.docker.io/v1/": {
                "username": "${{ secrets.DOCKERHUB_USERNAME }}",
                "password": "${{ secrets.DOCKERHUB_TOKEN }}"
              }
            }
          }
          EOF

      - 
        name: Build and Push
        env:
          DOCKER_CONFIG: /tmp/.docker
        run: |
          /kaniko/executor \
            --dockerfile "${GITHUB_WORKSPACE}/Dockerfile" \
            --context "${GITHUB_WORKSPACE}" \
            --destination "${{ secrets.DOCKERHUB_USERNAME }}/python-app:${COMMIT_SHORT_SHA}" \
            --custom-platform=linux/amd64 \
            --cache=true