name: ci

on:
  push:
    paths:
      - 'src/**'
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions: {
      contents: read
    }
    outputs:
      COMMIT_SHORT_SHA: ${{ steps.get_commit_sha.outputs.COMMIT_SHORT_SHA }}
    steps:
      -
       uses: actions/checkout@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - 
        name: Get the last 7 characters of the git commit SHA
        id: get_commit_sha
        run: |
          github_sha_hash=${{ github.sha }}
          github_sha_short="${github_sha_hash:0:7}"
          echo "COMMIT_SHORT_SHA=$github_sha_short" >> $GITHUB_ENV
          echo "COMMIT_SHORT_SHA=$github_sha_short" >> $GITHUB_OUTPUT

      - 
        name: Confirm git commit SHA output
        run: echo ${{ env.COMMIT_SHORT_SHA }}
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:${{ env.COMMIT_SHORT_SHA }}
      
      # - name: Run Trivy vulnerability scanner
      #   uses: aquasecurity/trivy-action@@v0.36.0
      #   with:
      #     image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/python-app:${{ env.COMMIT_SHORT_SHA }}
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'CRITICAL,HIGH'
    
  
  cd:
    runs-on: self-hosted
    needs: ci
    permissions:
      contents: write  
    env:
      COMMIT_SHORT_SHA: ${{ needs.ci.outputs.COMMIT_SHORT_SHA }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache ArgoCD CLI
        id: cache-argocd
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/argocd
          key: argocd-${{ runner.arch }}-v3.4.4

      - name: Setup ArgoCD CLI
        if: steps.cache-argocd.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL -o ~/.local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/download/v3.4.4/argocd-linux-arm64
          chmod +x ~/.local/bin/argocd
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # - name: Setup ArgoCD CLI
      #   run: |
      #     curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
      #     mkdir -p "$RUNNER_TEMP/argocd"
      #     install -m 555 argocd-linux-amd64 "$RUNNER_TEMP/argocd/argocd"
      #     rm argocd-linux-amd64
      #     echo "$RUNNER_TEMP/argocd" >> "$GITHUB_PATH"
      
      - name: Verify ArgoCD
        run: argocd version --client

      - name: Setup yq
        env:
          VERSION: v4.53.2
          PLATFORM: linux_amd64
        run: |
          apt update &&  apt install -y wget
          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_${PLATFORM}.tar.gz -O - |\
          tar xz &&  mv yq_${PLATFORM} /usr/local/bin/yq &&  chmod +x /usr/local/bin/yq

      - name: Update the image tag in the Helm values file
        run: |
          yq eval -i '.image.tag = env(COMMIT_SHORT_SHA)' charts/python-app/values.yaml
          git diff charts/python-app/values.yaml
      
      - name: Commit files
        run: |
            git config --local user.email "github-actions[bot]"
            git config --local user.name "github-actions[bot]"
            git commit -a -m "Update the image tag to $COMMIT_SHORT_SHA"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: main


      - name: argocd sync
        env:
          ARGOCD_SERVER: argocd-server.argocd.svc.cluster.local
          ARGOCD_OPTS: --grpc-web --insecure 
        run: |
          set -x
          argocd version
          argocd login $ARGOCD_SERVER  --grpc-web --insecure  \
            --username ${{ secrets.ARGOCD_USERNAME }} --password ${{ secrets.ARGOCD_PASSWORD }}
          argocd proj list
          argocd app list
          argocd app sync python-app
          echo "Deployed image with tag: $COMMIT_SHORT_SHA"
